syntax = "proto3";

package voyager.pluginhost.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Voyager.Contracts.PluginHost.V1";

// What the plugin host of the local service knows about the plugins, for the "About" screen and for the
// user interface, which loads the interface part of each plugin (ADR-0015).
// The package voyager.plugins.<id>.v1 is reserved for the services of the plugins themselves.
service PluginHostService {
  // Lists the plugins found at startup: those in use, those that were set aside, with the reason, and those the
  // user disabled, with what the user asked for them since the service started.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  // Asks the sources of diagnostic facts (the service itself and the plugins) for their facts. A source
  // that fails or is too slow is reported as such and does not affect the others.
  rpc GetDiagnosticFacts(GetDiagnosticFactsRequest) returns (GetDiagnosticFactsResponse);
  // Examines a package the desktop app prepared in the staging folder, before the user confirms its installation:
  // what it holds, whether it is refused and why, and what installing it would do. Nothing is installed, and nothing
  // of the package runs. INVALID_ARGUMENT when the name is not that of a prepared package, NOT_FOUND when there is no
  // such package, FAILED_PRECONDITION when plugins cannot be managed, UNAVAILABLE when the disk refused to read or write.
  rpc ExaminePackage(ExaminePackageRequest) returns (ExaminePackageResponse);
}

// Request of PluginHostService.ExaminePackage.
message ExaminePackageRequest {
  // Name of the prepared copy in the staging folder: 32 lower-case hexadecimal characters the desktop app chose at
  // random, and ".voyagerplugin". Never a path, never the name of the file the user chose.
  string staged_name = 1;
}

// Response of PluginHostService.ExaminePackage. The texts that come from the package are identifiers and versions
// that the service checked.
message ExaminePackageResponse {
  // SHA-256 fingerprint of the package, in lower-case hexadecimal.
  string sha256 = 1;
  // Size of the package, in bytes.
  uint64 size = 2;
  // Why the package is refused. PACKAGE_REFUSAL_UNSPECIFIED when it can be installed.
  PackageRefusal refusal = 3;
  // Identifier of the plugin. Empty when the manifest could not be read.
  string id = 4;
  // Version of the plugin. Empty when the manifest could not be read.
  string version = 5;
  // Contracts the plugin provides and requires, with their state. Empty when the manifest could not be read.
  repeated ContractUse contracts = 6;
  // Whether the plugin brings .NET code.
  bool has_dotnet = 7;
  // Whether the plugin brings an interface part.
  bool has_ui = 8;
  // Who vouches for the plugin.
  PluginVerification verification = 9;
  // Whether a plugin shipped with Voyager already has this identifier: the installed one would be set aside until the
  // user disables the shipped one.
  bool duplicate_of_shipped = 10;
  // Version of the plugin already installed under this identifier. Empty when there is none.
  string installed_version = 11;
  // What installing the package would do. PACKAGE_INSTALL_KIND_UNSPECIFIED when the manifest could not be read.
  PackageInstallKind install_kind = 12;
}

// Why a package is refused at its examination.
enum PackageRefusal {
  // No refusal: the package can be installed.
  PACKAGE_REFUSAL_UNSPECIFIED = 0;
  // The file is not a readable archive.
  PACKAGE_REFUSAL_UNREADABLE = 1;
  // The manifest is missing, invalid, declares no part, or names a reserved identifier.
  PACKAGE_REFUSAL_MANIFEST_INVALID = 2;
  // A file the manifest declares (the assembly, the interface module) is not in the package.
  PACKAGE_REFUSAL_DECLARED_FILE_MISSING = 3;
  // A contract the plugin provides or requires is in a version the application does not support.
  PACKAGE_REFUSAL_CONTRACT_NOT_SUPPORTED = 4;
  // The package holds a file or a name that is not allowed: outside the plugin, a link, a native library...
  PACKAGE_REFUSAL_FORBIDDEN_ENTRY = 5;
  // The disk does not have the space to extract the package.
  PACKAGE_REFUSAL_NOT_ENOUGH_SPACE = 6;
}

// What installing a package would do, compared with the plugin already installed under the same identifier.
enum PackageInstallKind {
  // Not known: the manifest could not be read.
  PACKAGE_INSTALL_KIND_UNSPECIFIED = 0;
  // No plugin of this identifier is installed.
  PACKAGE_INSTALL_KIND_NEW = 1;
  // It replaces an older version.
  PACKAGE_INSTALL_KIND_UPGRADE = 2;
  // It replaces a newer version: the confirmation warns of it.
  PACKAGE_INSTALL_KIND_DOWNGRADE = 3;
  // It installs the same version again.
  PACKAGE_INSTALL_KIND_REINSTALL = 4;
}

// Request of PluginHostService.ListPlugins. Intentionally empty.
message ListPluginsRequest {}

// Response of PluginHostService.ListPlugins.
message ListPluginsResponse {
  // Every plugin folder found: the shipped plugins first, then the installed ones, each in alphabetical order of
  // folder names.
  repeated Plugin plugins = 1;
}

// A plugin folder found at startup.
message Plugin {
  // Name of the folder of the plugin. Unique within its origin, even when two plugins claim the same identifier:
  // with origin, it is what names a plugin in the requests of the user.
  string folder = 1;
  // Identifier of the plugin, written in its manifest; the folder name when the manifest is unreadable.
  string id = 2;
  // Version of the plugin; empty when the manifest is unreadable.
  string version = 3;
  // Whether the plugin is in use.
  PluginStatus status = 4;
  // Why the plugin was set aside. Only set when the status is PLUGIN_STATUS_REJECTED.
  PluginRejectionReason rejection_reason = 5;
  // Path of the user interface module, relative to the ui folder of the plugin. Empty when a plugin has
  // no interface part or is not in use.
  string ui_module = 6;
  // Extension points the plugin provides (for example "diagnostic-fact-source"). Empty when not in use.
  repeated string provides = 7;
  // Contracts the plugin provides and requires, with the version it was written for and whether the application
  // accepts that version (ADR-0017). Empty when the manifest is unreadable.
  repeated ContractUse contracts = 8;
  // Where the plugin comes from: shipped with Voyager, or installed by the user.
  PluginOrigin origin = 9;
  // Who vouches for the plugin.
  PluginVerification verification = 10;
  // Whether the plugin brings .NET code, as its manifest says. False when the manifest is unreadable.
  bool has_dotnet = 11;
  // Whether the plugin brings an interface part, as its manifest says. False when the manifest is unreadable.
  bool has_ui = 12;
  // When an installed plugin was installed. Not set for a shipped plugin.
  google.protobuf.Timestamp installed_at = 13;
  // File name of the package an installed plugin came from. Empty for a shipped plugin.
  string package_name = 14;
  // SHA-256 fingerprint of that package, in lower-case hexadecimal. Empty for a shipped plugin.
  string package_sha256 = 15;
  // The last request the user confirmed for this plugin since the service started, applied at the next start.
  // PLUGIN_REQUEST_ACTION_UNSPECIFIED when none is waiting.
  PluginRequestAction pending_request = 16;
  // The last request for this plugin that could not be applied, with failed_request_reason.
  // PLUGIN_REQUEST_ACTION_UNSPECIFIED when the last one was applied.
  PluginRequestAction failed_request = 17;
  // Why failed_request could not be applied. PLUGIN_REQUEST_FAILURE_UNSPECIFIED when failed_request is
  // PLUGIN_REQUEST_ACTION_UNSPECIFIED.
  PluginRequestFailure failed_request_reason = 18;
  // Whether a start without the installed plugins disabled it, rather than the user: the user enables them again one by
  // one to find the one that crashes Voyager.
  bool disabled_for_recovery = 19;
}

// Where a plugin comes from (ADR-0016).
enum PluginOrigin {
  // Not set, never sent.
  PLUGIN_ORIGIN_UNSPECIFIED = 0;
  // Shipped with Voyager: it can be disabled, never uninstalled.
  PLUGIN_ORIGIN_SHIPPED = 1;
  // Installed by the user from a package.
  PLUGIN_ORIGIN_INSTALLED = 2;
}

// Who vouches for a plugin (ADR-0016, decision 7).
enum PluginVerification {
  // Not set, never sent.
  PLUGIN_VERIFICATION_UNSPECIFIED = 0;
  // Shipped with Voyager: the signature of the application covers it.
  PLUGIN_VERIFICATION_GUARANTEED_BY_APPLICATION = 1;
  // Installed from a file that no known key signs: code of a third party, accepted at the user's risk.
  PLUGIN_VERIFICATION_UNVERIFIED = 2;
}

// What a request of the user asks for a plugin.
enum PluginRequestAction {
  // No request.
  PLUGIN_REQUEST_ACTION_UNSPECIFIED = 0;
  // Install, or replace, the plugin from a package.
  PLUGIN_REQUEST_ACTION_INSTALL = 1;
  // Remove the installed plugin.
  PLUGIN_REQUEST_ACTION_UNINSTALL = 2;
  // Load the plugin again.
  PLUGIN_REQUEST_ACTION_ENABLE = 3;
  // Stop loading the plugin, without removing it.
  PLUGIN_REQUEST_ACTION_DISABLE = 4;
}

// Why a request of the user could not be applied.
enum PluginRequestFailure {
  // Not set, never sent.
  PLUGIN_REQUEST_FAILURE_UNSPECIFIED = 0;
  // The plugin the request names is not there.
  PLUGIN_REQUEST_FAILURE_NOT_FOUND = 1;
  // The request does not apply to this plugin, for example uninstalling a shipped plugin.
  PLUGIN_REQUEST_FAILURE_NOT_ALLOWED = 2;
  // A folder or a file could not be changed: rights, or a file locked by another program.
  PLUGIN_REQUEST_FAILURE_FILE_SYSTEM_ERROR = 3;
  // This version of the application does not apply such a request yet.
  PLUGIN_REQUEST_FAILURE_NOT_SUPPORTED = 4;
  // The prepared copy of the package is no longer there.
  PLUGIN_REQUEST_FAILURE_PACKAGE_MISSING = 5;
  // The prepared copy changed since the user confirmed it: its fingerprint is not the one they saw.
  PLUGIN_REQUEST_FAILURE_PACKAGE_CHANGED = 6;
  // The package was refused at its examination, or holds another plugin than the request names.
  PLUGIN_REQUEST_FAILURE_PACKAGE_REFUSED = 7;
  // The disk does not have the space to install the plugin.
  PLUGIN_REQUEST_FAILURE_NOT_ENOUGH_SPACE = 8;
}

// A contract that a plugin provides or requires.
message ContractUse {
  // Identifier of the contract, for example "diagnostic-fact-source", or "plugin" for the base contract.
  string contract = 1;
  // Version of the contract the plugin was written for: a whole number, 1 for the first one.
  uint32 version = 2;
  // Whether the plugin provides or requires the contract.
  ContractRole role = 3;
  // Whether the application accepts this version.
  ContractUseState state = 4;
}

// What a plugin does with a contract.
enum ContractRole {
  // The role is not set. Never sent by the service.
  CONTRACT_ROLE_UNSPECIFIED = 0;
  // The plugin provides an implementation of the contract.
  CONTRACT_ROLE_PROVIDED = 1;
  // The plugin needs the contract to work, for example the base contract "plugin".
  CONTRACT_ROLE_REQUIRED = 2;
}

// Whether the application accepts the version of a contract that a plugin uses.
enum ContractUseState {
  // The state is not set. Never sent by the service; distinct from CONTRACT_USE_STATE_UNKNOWN.
  CONTRACT_USE_STATE_UNSPECIFIED = 0;
  // The application accepts this version.
  CONTRACT_USE_STATE_SUPPORTED = 1;
  // The application accepts this version, and a later release will remove it.
  CONTRACT_USE_STATE_DEPRECATED = 2;
  // The application no longer accepts this version: the plugin is too old.
  CONTRACT_USE_STATE_OBSOLETE = 3;
  // The application does not know this contract or this version: the plugin is too recent, or requires a
  // contract that the application does not provide.
  CONTRACT_USE_STATE_UNKNOWN = 4;
}

// Whether a plugin is in use.
enum PluginStatus {
  // The status is not known.
  PLUGIN_STATUS_UNSPECIFIED = 0;
  // The plugin is loaded and what it provides is available.
  PLUGIN_STATUS_LOADED = 1;
  // The plugin was set aside.
  PLUGIN_STATUS_REJECTED = 2;
  // The user disabled the plugin: it is not loaded.
  PLUGIN_STATUS_DISABLED = 3;
  // The plugin is suspected of having crashed the service: it is not loaded until the user disables it for good or
  // enables it again.
  PLUGIN_STATUS_SUSPENDED = 4;
}

// Why a plugin was set aside at startup.
enum PluginRejectionReason {
  // No reason: the plugin is in use.
  PLUGIN_REJECTION_REASON_UNSPECIFIED = 0;
  // The manifest is missing, unreadable, incomplete, or does not match the folder of the plugin.
  PLUGIN_REJECTION_REASON_MANIFEST_INVALID = 1;
  // Another plugin, found first, already has this identifier.
  PLUGIN_REJECTION_REASON_DUPLICATE_ID = 2;
  // No longer sent: compatibility is judged by contract (PLUGIN_REJECTION_REASON_CONTRACT_NOT_SUPPORTED, ADR-0017).
  // Kept so that the numbers of the other values never change.
  PLUGIN_REJECTION_REASON_SDK_INCOMPATIBLE = 3 [deprecated = true];
  // The .NET part of the plugin could not be loaded or configured.
  PLUGIN_REJECTION_REASON_LOAD_FAILED = 4;
  // The plugin registered an extension point that its manifest does not announce.
  PLUGIN_REJECTION_REASON_UNDECLARED_REGISTRATION = 5;
  // A contract that the plugin provides or requires is in a version that the application does not accept:
  // obsolete or unknown. The contracts field of the plugin says which ones.
  PLUGIN_REJECTION_REASON_CONTRACT_NOT_SUPPORTED = 6;
  // A plugin shipped with Voyager already has this identifier: the user can disable it to use this installed one.
  PLUGIN_REJECTION_REASON_DUPLICATE_OF_SHIPPED = 7;
}

// Request of PluginHostService.GetDiagnosticFacts.
message GetDiagnosticFactsRequest {
  // The source to ask: "service" or the identifier of a plugin. Empty to ask every source.
  string source_id = 1;
}

// Response of PluginHostService.GetDiagnosticFacts.
message GetDiagnosticFactsResponse {
  // One entry per source asked, in registration order.
  repeated SourceFacts sources = 1;
}

// What one source of diagnostic facts gave.
message SourceFacts {
  // "service" for the service itself, or the identifier of the plugin that provides the source.
  string source_id = 1;
  // How the source answered.
  FactsOutcome outcome = 2;
  // The facts that were kept. Empty unless the outcome is FACTS_OUTCOME_SUCCEEDED.
  repeated Fact facts = 3;
  // True when the source gave more facts than the limit and the last ones were left out.
  bool truncated = 4;
}

// How a source of diagnostic facts answered.
enum FactsOutcome {
  // The outcome is not known.
  FACTS_OUTCOME_UNSPECIFIED = 0;
  // The source answered.
  FACTS_OUTCOME_SUCCEEDED = 1;
  // The source threw an exception.
  FACTS_OUTCOME_FAILED = 2;
  // The source did not answer in time.
  FACTS_OUTCOME_TIMED_OUT = 3;
  // The source answered with facts the host refuses.
  FACTS_OUTCOME_INVALID = 4;
}

// A piece of information about the service, with a translatable label.
message Fact {
  // Identifier of the label's message in the translations of the source, for example
  // "diagnostics-clock-fact-now". Never a sentence.
  string label_id = 1;
  // The value; its kind is the one that is set.
  oneof value {
    // A text, shown as is.
    string text = 2;
    // A number, to format for the user's language.
    double number = 3;
    // An instant, to show in the user's language and time zone.
    google.protobuf.Timestamp instant = 4;
  }
}
