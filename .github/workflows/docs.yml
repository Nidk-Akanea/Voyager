name: Docs

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Same markdownlint-cli2 version as on developer machines and in Claude's hook (package.json).
      - run: pnpm lint:md
